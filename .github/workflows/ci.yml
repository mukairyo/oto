# Checks every pull request and EVERY push to every branch, main included, whether or not the version changed:
# unit tests, the security rules in scripts/lint.js, and known-vulnerability check of the shipped packages.
# (The release workflow runs the same tests again before it builds an installer.)
name: Checks

on:
  pull_request:
  push:
    branches-ignore: [android] # the Android app has its own build

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # the tests don't need Electron itself
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - name: Known vulnerabilities in what Oto ships
        run: npm audit --omit=dev --audit-level=high

  # Windows packaging check on every push: builds the unpacked Windows app (no installer, no publishing) and checks
  # what's inside the app archive: Oto's code is there, and tests, scripts, keys or exports never are.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the unpacked Windows app
        run: npm run pack
      - name: Check what's packaged
        shell: bash
        run: |
          test -f dist/win-unpacked/Oto.exe
          node -e "
            const files = require('@electron/asar').listPackage('dist/win-unpacked/resources/app.asar').map((f) => f.replace(/\\\\/g, '/'));
            const must = ['/main.js', '/preload.bundle.js', '/page-preload.js', '/main/attest.js', '/main/ipc-guard.js', '/main/passwords.js', '/src/index.html'];
            const never = /^\/(test|scripts|\.github|docs)\/|\.(pem|key|jks|p12|pfx|env|oto|csv)$|SHA256SUMS/i;
            const missing = must.filter((f) => !files.includes(f));
            const leaked = files.filter((f) => never.test(f));
            console.log(files.length + ' files in app.asar');
            if (missing.length) { console.error('missing:', missing); process.exit(1); }
            if (leaked.length) { console.error('should not be packaged:', leaked); process.exit(1); }
            console.log('packaged contents OK');
          "
