# Checks every pull request and every branch push (main and v1 also run them inside the release workflow):
# unit tests, the security rules in scripts/lint.js, and known-vulnerability check of the shipped packages.
name: Checks

on:
  pull_request:
  push:
    branches-ignore: [main, v1, android]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # the tests don't need Electron itself
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - name: Known vulnerabilities in what Oto ships
        run: npm audit --omit=dev --audit-level=high
