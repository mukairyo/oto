# Checks every day for a newer Electron (= newer Chromium with security fixes) in the major version
# Oto uses. If there is one, it prepares the update (package files + changelog entry) on its own branch and opens a
# pull request. Nothing is released until Ryo merges it: a bad or tampered upstream Electron can't reach everyone's Oto
# by itself. Merging starts "Build & release" as usual. A brand-new major Electron is reported as an issue instead.
name: Chromium updates

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Look for a newer Electron
        id: bump
        run: node .github/scripts/chromium-update.mjs

      - name: Open a pull request with the update
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.bump.outputs.version }}
          E: ${{ steps.bump.outputs.electron }}
          C: ${{ steps.bump.outputs.chrome }}
        run: |
          branch="bot/electron-$E"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then echo "$branch is already waiting for review."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898776+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Security update $V: Electron $E (Chromium $C)"
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Security update $V: Electron $E (Chromium $C)" \
            --body "A newer Electron $E (Chromium $C) is out in the major version Oto uses. This pull request updates package.json, package-lock.json and CHANGELOG.md. Merge it to build and release Oto $V (the release runs all tests first); nothing is published before that."

      - name: Report a new major Electron
        if: steps.bump.outputs.major != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Electron ${{ steps.bump.outputs.major }} is out — test before switching"
          if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "A new major version of Electron (${{ steps.bump.outputs.major }}) is available. Oto keeps getting security fixes on its current version automatically; moving to a new major version can need code changes, so it isn't done automatically. Ask Claude to switch Oto to Electron ${{ steps.bump.outputs.major }} and test it."
          fi

      # A release can fail for reasons that pass by themselves (GitHub not serving a download, a slow test machine).
      # Nothing used to try again, so a security update could sit unreleased without anyone noticing. Every day:
      # if the version on main still has no finished release and none is running, start it again and open an issue.
      - name: Finish a release that didn't complete
        if: steps.bump.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "const p=require('./package.json'); p.otoVersion || p.version")
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.yml$'; then echo "Oto $v is released."; exit 0; fi
          running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch main --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length' || echo unknown)
          if [ "$running" != "0" ]; then echo "Oto $v: a release is running (or GitHub didn't answer). Checked again tomorrow."; exit 0; fi
          echo "Oto $v is on main but has no finished release: starting the release again."
          gh workflow run release.yml --ref main --repo "$GITHUB_REPOSITORY"
          title="Oto $v was not released — trying again"
          if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The release of Oto $v did not finish (see the Build & release runs under Actions), so people have not received it yet. The daily check has started it again and will keep doing so once a day until it is out. If it keeps failing, ask Claude to look at the failed run."
          fi
