# A private test installer for Ryo: Actions → Test build → Run workflow, or push a branch named test-build/<name>. Nothing is published:
# the installer is a workflow artifact, kept 7 days. It's versioned <version>-test.<run>, which counts as OLDER than the
# real release, so a test install updates itself to the real version once that's published.
# No build record (attestation) is made for test builds: only real releases get one.
name: Test build

on:
  workflow_dispatch:
  push:
    branches: ['test-build/**'] # push a branch named test-build/<anything> to get a test installer from it

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install (with Electron)
        shell: bash
        # GitHub sometimes answers the castlabs Electron download with 504, and Electron's installer then fails without an
        # error: done only when Electron is really there. Up to 5 tries, waiting longer each time.
        run: n=0; until npm ci && node -e "require('fs').accessSync(require('electron'))"; do n=$((n+1)); [ $n -ge 5 ] && exit 1; echo "retrying in $((n*30)) s"; sleep $((n*30)); done
      - name: Tests
        run: |
          npm test
          npm run lint
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the VMP signing tool
        run: python -m pip install --upgrade castlabs-evs
      - name: Build the test installer
        id: build
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          base=$(node -p "require('./package.json').otoVersion")
          v="$base-test.$GITHUB_RUN_NUMBER"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          export OTO_VERSION="$v"
          n=0; until npx electron-builder --win nsis --x64 --publish never "-c.electronDist=$(node -p "require('path').dirname(require('electron'))")" -c.extraMetadata.version="$v" -c.extraMetadata.otoVersion="$v"; do n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "retrying in 30 s (build tools from the npm mirror; electron-builder checks their SHA-256)"; export ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/; rm -rf dist; sleep 30; done
          ls dist/*.exe
          cd dist && sha256sum Oto-Setup-*.exe | tee SHA256SUMS-test.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Oto-${{ steps.build.outputs.version }}
          path: |
            dist/Oto-Setup-*.exe
            dist/SHA256SUMS-test.txt
          retention-days: 7
          if-no-files-found: error
