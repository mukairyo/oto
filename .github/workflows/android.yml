# Oto for Android — builds an arm64 APK on every push to the "android" branch. The version is in android/VERSION;
# the APK (Oto-Android-<VERSION>-arm64.apk) is added to the current Oto for Windows release when that number
# changes, and only when it's signed with the Oto key (so phones can always update over it).
name: Android build

on:
  push:
    branches: [android, android-dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Newest stable GeckoView
        run: |
          V=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p' | head -1)
          echo "GeckoView $V"
          echo "GECKO=$V" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/oto.jks"; echo "OTO_KS_FILE=$RUNNER_TEMP/oto.jks" >> "$GITHUB_ENV"; echo "Signed with the Oto key";
          else echo "::warning::No ANDROID_KEYSTORE_B64 secret yet — this build uses a temporary key"; fi

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(tr -d ' \n\r' < android/VERSION)
          W=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "v=$V" >> "$GITHUB_OUTPUT"; echo "w=$W" >> "$GITHUB_OUTPUT"
          if gh release view "$W" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "Oto-Android-$V-arm64.apk"; then
            echo "Oto-Android-$V is already on $W: build only"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          OTO_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          OTO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon --stacktrace -PgeckoVersion="$GECKO" -PversionCode=${{ github.run_number }} -PversionName=${{ steps.ver.outputs.v }}

      # android-dev: just check that it builds (no release)
      - name: Keep the APK (dev build)
        if: github.ref != 'refs/heads/android' || steps.ver.outputs.skip == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oto-android-dev
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 3

      - name: Put the APK on the Oto release
        if: github.ref == 'refs/heads/android' && steps.ver.outputs.skip != 'true' && env.OTO_KS_FILE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.ver.outputs.v }}
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" "Oto-Android-$V-arm64.apk"
          gh release upload "${{ steps.ver.outputs.w }}" "Oto-Android-$V-arm64.apk" --clobber --repo "$GITHUB_REPOSITORY"

      # A commit message with [replace-apk] rebuilds the same version and swaps the APK on the Oto release.
      # Only with the real Oto key, so a temporary key never replaces it.
      - name: Replace the APK on the release
        if: github.ref == 'refs/heads/android' && steps.ver.outputs.skip == 'true' && contains(github.event.head_commit.message, '[replace-apk]') && env.OTO_KS_FILE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.ver.outputs.v }}
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" "Oto-Android-$V-arm64.apk"
          gh release upload "${{ steps.ver.outputs.w }}" "Oto-Android-$V-arm64.apk" --clobber --repo "$GITHUB_REPOSITORY"
          echo "replaced on ${{ steps.ver.outputs.w }}"
