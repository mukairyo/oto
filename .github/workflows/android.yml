# Oto for Android — builds an arm64 APK on every push to the "android" branch. The version is in android/VERSION;
# the APK (Oto-Android-<VERSION>-arm64.apk) is added to the current Oto for Windows release when that number
# changes, and only when it's signed with the Oto key (so phones can always update over it).
# Engine updates: a daily job on main (android-engine.yml) starts this with engine=true. If GeckoView has a newer
# version than the one in the last Oto for Android (android/GECKO), the version goes up by one and a new APK ships.
# The tools this build uses are fixed to exact, checked versions (the long codes after the @), because this build
# signs the app with the Oto key: a tool that changed on its own must never run here.
name: Android build

on:
  push:
    branches: [android, android-dev]
  # Dependabot's weekly pull requests for this branch (build tools, libraries): build them to see they still work.
  # A pull request gets no signing key and can't publish anything: it only builds.
  pull_request:
    branches: [android]
  workflow_dispatch:
    inputs:
      engine:
        description: 'Only build if there is a newer GeckoView (daily engine check)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The daily engine check: if GeckoView is newer, the version goes up by one (a commit on this branch). Only this
  # small job and the publishing job below may write to the repository; the build itself is read-only.
  engine:
    if: inputs.engine
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      stop: ${{ steps.check.outputs.stop }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Newer engine?
        id: check
        run: |
          GECKO=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p' | head -1)
          OLD=$(tr -d ' \n\r' < android/GECKO 2>/dev/null || true)
          if [ -z "$GECKO" ] || [ "$OLD" = "$GECKO" ]; then echo "Oto for Android already has GeckoView ${OLD:-?}"; echo "stop=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          V=$(tr -d ' \n\r' < android/VERSION)
          NEW=$(echo "$V" | awk -F. '{ printf "%d.%d.%d", $1, $2, ($3 == "" ? 0 : $3) + 1 }')
          echo "$NEW" > android/VERSION
          echo "GeckoView $OLD -> $GECKO: Oto for Android $V -> $NEW"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/VERSION && git commit -m "Oto for Android $NEW: newer engine (GeckoView $GECKO)" && git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Builds (and, with the Oto key, signs) the APK. Read-only: Gradle and the libraries it downloads run here, so this
  # job can't publish releases or push to the repository.
  apk:
    needs: engine
    if: ${{ !cancelled() && (needs.engine.result == 'skipped' || (needs.engine.result == 'success' && needs.engine.outputs.stop != '1')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      v: ${{ steps.ver.outputs.v }}
      w: ${{ steps.ver.outputs.w }}
      skip: ${{ steps.ver.outputs.skip }}
      signed: ${{ steps.key.outputs.signed }}
      gecko: ${{ steps.gecko.outputs.gecko }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.engine.outputs.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.6.0'

      - name: Newest stable GeckoView
        id: gecko
        run: |
          V=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p' | head -1)
          echo "GeckoView $V"
          echo "GECKO=$V" >> "$GITHUB_ENV"; echo "gecko=$V" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/oto.jks"; echo "OTO_KS_FILE=$RUNNER_TEMP/oto.jks" >> "$GITHUB_ENV"; echo "signed=true" >> "$GITHUB_OUTPUT"; echo "Signed with the Oto key";
          else echo "::warning::No ANDROID_KEYSTORE_B64 secret yet — this build uses a temporary key"; fi

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(tr -d ' \n\r' < android/VERSION)
          W=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "v=$V" >> "$GITHUB_OUTPUT"; echo "w=$W" >> "$GITHUB_OUTPUT"
          if gh release view "$W" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "Oto-Android-$V-arm64.apk"; then
            echo "Oto-Android-$V is already on $W: build only"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          OTO_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          OTO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon --stacktrace -PgeckoVersion="$GECKO" -PversionCode=${{ github.run_number }} -PversionName=${{ steps.ver.outputs.v }}

      - name: Name the APK and its checksum
        run: |
          V=${{ steps.ver.outputs.v }}
          mkdir out && cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" "out/Oto-Android-$V-arm64.apk"
          (cd out && sha256sum "Oto-Android-$V-arm64.apk" | tee apk.sha256)
          rm -f "$RUNNER_TEMP/oto.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oto-android-dev
          path: out/
          retention-days: 3

  # Publishing: runs no build tools. Puts the signed APK on the current Oto release (only from the "android" branch,
  # only signed with the Oto key so phones can always update over it) and remembers the engine version.
  publish:
    needs: apk
    if: ${{ !cancelled() && needs.apk.result == 'success' && github.ref == 'refs/heads/android' && needs.apk.outputs.signed == 'true' && (needs.apk.outputs.skip != 'true' || contains(github.event.head_commit.message, '[replace-apk]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: android

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oto-android-dev
          path: out

      - name: Check the APK
        run: cd out && sha256sum -c apk.sha256

      # A new version is added; a commit message with [replace-apk] rebuilds the same version and swaps the APK.
      - name: Put the APK on the Oto release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ needs.apk.outputs.v }}
          gh release upload "${{ needs.apk.outputs.w }}" "out/Oto-Android-$V-arm64.apk" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Oto-Android-$V on ${{ needs.apk.outputs.w }}"

      - name: Remember the engine version
        if: needs.apk.outputs.skip != 'true'
        run: |
          GECKO="${{ needs.apk.outputs.gecko }}"
          V=${{ needs.apk.outputs.v }}
          if [ -n "$GECKO" ] && [ "$(tr -d ' \n\r' < android/GECKO 2>/dev/null)" != "$GECKO" ]; then
            echo "$GECKO" > android/GECKO
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/GECKO && git commit -m "Oto for Android $V has GeckoView $GECKO" && git pull --rebase -q && git push || echo "::warning::couldn't save android/GECKO"
          fi
