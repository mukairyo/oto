# Builds the Windows installer on GitHub and publishes it as a release.
# Runs on every push to main; skips if a release for the version in package.json already exists.
# Oto checks these releases for updates (electron-updater, provider: github).
name: Build & release

on:
  push:
    # v1 = Ryo's Oto v1 owner builds (1.0.0-owner.N pre-releases on the hidden Owner channel)
    branches: [main, v1]
  workflow_dispatch:

# Least privilege: nothing by default; each job asks only for what it needs.
permissions:
  contents: read

jobs:
  # Everything that runs other people's code (npm packages, the EVS tool, the tests, the build) happens here, with
  # read-only access: this job can't publish releases, push to the repository or make build records.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is this version already released?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Shown version: otoVersion (e.g. 0.9.8.1); the updater uses "version" (e.g. 0.9.801).
          v=$(node -p "const p=require('./package.json'); p.otoVersion || p.version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Done only if the release exists AND has latest.yml (what Oto's updater reads).
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.yml$'; then
            echo "v$v is already released, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # A release only reaches people if its number is higher than the one they have (main/version.js).
      - name: Is this version newer than the published one?
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/version-guard.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.skip != 'true'
        shell: bash
        # GitHub sometimes answers the castlabs Electron download with 504, and Electron's installer then fails without an
        # error: done only when Electron is really there. Up to 5 tries, waiting longer each time.
        run: n=0; until npm ci && node -e "require('fs').accessSync(require('electron'))"; do n=$((n+1)); [ $n -ge 5 ] && exit 1; echo "retrying in $((n*30)) s"; sleep $((n*30)); done

      # Red tests, a broken security rule, a known high-severity vulnerability in what Oto ships, or a failed
      # end-to-end check of the real app (on Windows: DPAPI, Mark of the Web…) stop the release before anything is built.
      - name: Tests and checks
        if: steps.check.outputs.skip != 'true'
        run: |
          npm test
          npm run lint
          npm audit --omit=dev --audit-level=high

      - name: End-to-end tests (Windows)
        if: steps.check.outputs.skip != 'true'
        run: npm run test:e2e

      # Production Widevine (VMP) signing for Netflix & co. — castlabs EVS, free account.
      # Set the repo secrets EVS_ACCOUNT_NAME and EVS_PASSWD to turn it on (build/vmp-sign.js).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: '3.12'

      # Exact versions with their SHA-256 (.github/requirements-evs.txt): a changed or newer package is refused.
      - name: Install the VMP signing tool
        if: steps.check.outputs.skip != 'true'
        run: python -m pip install --require-hashes --only-binary ':all:' -r .github/requirements-evs.txt

      - name: Build installer
        if: steps.check.outputs.skip != 'true'
        env:
          OTO_VERSION: ${{ steps.check.outputs.version }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        shell: bash
        # Builds with the Electron npm ci installed (no second download); retried up to 3 times (each try from scratch).
        # If GitHub won't serve the NSIS tools, retries use the npm mirror: electron-builder pins their SHA-256, so a
        # changed file is refused.
        run: n=0; until npx electron-builder --win nsis --x64 --publish never "-c.electronDist=$(node -p "require('path').dirname(require('electron'))")"; do n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "retrying in 30 s (build tools from the npm mirror; electron-builder checks their SHA-256)"; export ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/; rm -rf dist; sleep 30; done

      - name: Check the Widevine signature
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
        run: if [ -n "$EVS_ACCOUNT_NAME" ]; then python -m castlabs_evs.vmp -n verify-pkg dist/win-unpacked; else echo "no EVS account, skipped"; fi

      # SHA-256 checksums (anyone can check a download wasn't changed).
      - name: Checksums
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          v="${{ steps.check.outputs.version }}"
          cd dist && sha256sum "Oto-Setup-$v.exe" "Oto-Setup-$v.exe.blockmap" latest*.yml | tee SHA256SUMS.txt

      - name: Hand the files to the release job
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          v="${{ steps.check.outputs.version }}"
          mkdir out && cp "dist/Oto-Setup-$v.exe" "dist/Oto-Setup-$v.exe.blockmap" dist/SHA256SUMS.txt out/
          for f in dist/*.yml; do [ "$(basename "$f")" = builder-debug.yml ] || cp "$f" out/; done
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.skip != 'true'
        with:
          name: release-files
          path: out/
          retention-days: 3
          if-no-files-found: error

  # Publishing: a short job that runs no packages, tests or build tools. It gets the files from the build job, checks
  # them against the build job's checksums, makes the signed GitHub build record (who built this installer, from which
  # commit) and publishes the release. Only this job has write access and the build-record token.
  release:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # publish the release
      id-token: write      # signed build provenance
      attestations: write
    outputs:
      version: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-files
          path: dist

      - name: Check the files
        shell: bash
        run: cd dist && ls -la && sha256sum -c SHA256SUMS.txt

      # gh attestation verify Oto-Setup-X.exe --repo mukairyo/oto
      - name: Build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/Oto-Setup-${{ needs.build.outputs.version }}.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ needs.build.outputs.version }}"
          files=("dist/Oto-Setup-$v.exe" "dist/Oto-Setup-$v.exe.blockmap" "dist/SHA256SUMS.txt")
          for f in dist/*.yml; do files+=("$f"); done
          # tester builds (e.g. 0.10.0-beta.1) are pre-releases: only Beta/Alpha testers get them
          pre=(); [[ "$v" == *-* ]] && pre=(--prerelease)
          ls -la "${files[@]}"
          bash .github/release-notes.sh "$v" > notes.md
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$v" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "v$v" --title "Oto $v" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$v" "${files[@]}" "${pre[@]}" --title "Oto $v" --notes-file notes.md --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

  # Downloads the installer exactly as the public gets it from the release page and checks it two ways:
  # its SHA-256 matches SHA256SUMS.txt, and GitHub's signed build record says this workflow built it from this
  # commit. If either fails, the run goes red so it's noticed right away.
  verify:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check the published installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.release.outputs.version }}
        run: |
          mkdir pub && cd pub
          gh release download "v$V" --repo "$GITHUB_REPOSITORY" -p "Oto-Setup-$V.exe" -p "Oto-Setup-$V.exe.blockmap" -p "SHA256SUMS.txt" -p "latest*.yml"
          sha256sum -c SHA256SUMS.txt
          gh attestation verify "Oto-Setup-$V.exe" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          # latest.yml (what the updater trusts) must describe this exact installer
          want=$(openssl dgst -sha512 -binary "Oto-Setup-$V.exe" | base64 -w0)
          grep -q "$want" latest.yml && echo "latest.yml matches the installer"

  # Keeps every release's notes in step with CHANGELOG.md (so fixing a typo there fixes the release page).
  notes:
    needs: release
    permissions:
      contents: write      # edit the release notes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            v="${tag#v}"
            bash .github/release-notes.sh "$v" > notes.md
            if grep -q . notes.md; then
              # GitHub sometimes answers 502 for a moment — retry, and never fail the release over old notes
              for try in 1 2 3; do
                if gh release edit "$tag" --title "Oto $v" --notes-file notes.md --repo "$GITHUB_REPOSITORY" >/dev/null; then echo "updated $tag"; break; fi
                echo "retrying $tag ($try)"; sleep $((try * 5))
              done
            fi
          done
