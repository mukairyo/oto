# Builds the Windows installer on GitHub and publishes it as a release.
# Runs on every push to main; skips if a release for the version in package.json already exists.
# Oto checks these releases for updates (electron-updater, provider: github).
name: Build & release

on:
  push:
    # v1 = Ryo's Oto v1 owner builds (1.0.0-owner.N pre-releases on the hidden Owner channel)
    branches: [main, v1]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # signed build provenance (who built this installer, from which commit)
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Is this version already released?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Shown version: otoVersion (e.g. 0.9.8.1); the updater uses "version" (e.g. 0.9.801).
          v=$(node -p "const p=require('./package.json'); p.otoVersion || p.version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Done only if the release exists AND has latest.yml (what Oto's updater reads).
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.yml$'; then
            echo "v$v is already released, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      # Red tests or a broken security rule stop the release before anything is built.
      - name: Tests and checks
        if: steps.check.outputs.skip != 'true'
        run: |
          npm test
          npm run lint

      # Production Widevine (VMP) signing for Netflix & co. — castlabs EVS, free account.
      # Set the repo secrets EVS_ACCOUNT_NAME and EVS_PASSWD to turn it on (build/vmp-sign.js).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install the VMP signing tool
        if: steps.check.outputs.skip != 'true'
        run: python -m pip install --upgrade castlabs-evs

      - name: Build installer
        if: steps.check.outputs.skip != 'true'
        env:
          OTO_VERSION: ${{ steps.check.outputs.version }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Check the Widevine signature
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
        run: if [ -n "$EVS_ACCOUNT_NAME" ]; then python -m castlabs_evs.vmp -n verify-pkg dist/win-unpacked; else echo "no EVS account, skipped"; fi

      # SHA-256 checksums (anyone can check a download wasn't changed) + a signed GitHub attestation that this
      # installer was built by this workflow from this commit: gh attestation verify Oto-Setup-X.exe --repo mukairyo/oto
      - name: Checksums
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          v="${{ steps.check.outputs.version }}"
          cd dist && sha256sum "Oto-Setup-$v.exe" "Oto-Setup-$v.exe.blockmap" latest*.yml | tee SHA256SUMS.txt

      - name: Build provenance
        if: steps.check.outputs.skip != 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/Oto-Setup-${{ steps.check.outputs.version }}.exe

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.check.outputs.version }}"
          files=("dist/Oto-Setup-$v.exe" "dist/Oto-Setup-$v.exe.blockmap" "dist/SHA256SUMS.txt")
          for f in dist/*.yml; do [ "$(basename "$f")" = builder-debug.yml ] || files+=("$f"); done
          # tester builds (e.g. 0.10.0-beta.1) are pre-releases: only Beta/Alpha testers get them
          pre=(); [[ "$v" == *-* ]] && pre=(--prerelease)
          ls -la "${files[@]}"
          bash .github/release-notes.sh "$v" > notes.md
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$v" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "v$v" --title "Oto $v" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$v" "${files[@]}" "${pre[@]}" --title "Oto $v" --notes-file notes.md --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

  # Keeps every release's notes in step with CHANGELOG.md (so fixing a typo there fixes the release page).
  notes:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Sync release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            v="${tag#v}"
            bash .github/release-notes.sh "$v" > notes.md
            if grep -q . notes.md; then
              # GitHub sometimes answers 502 for a moment — retry, and never fail the release over old notes
              for try in 1 2 3; do
                if gh release edit "$tag" --title "Oto $v" --notes-file notes.md --repo "$GITHUB_REPOSITORY" >/dev/null; then echo "updated $tag"; break; fi
                echo "retrying $tag ($try)"; sleep $((try * 5))
              done
            fi
          done
