# Builds the Windows installer and (1.9.4) the Linux packages (an Arch package and an AppImage) on GitHub and
# publishes them together as one release.
# Runs on every push to main; skips if a release for the version in package.json already exists.
# Oto checks these releases for updates (electron-updater, provider: github).
name: Build & release

on:
  push:
    # v1 = Ryo's Oto v1 owner builds (1.0.0-owner.N pre-releases on the hidden Owner channel)
    branches: [main, v1]
  workflow_dispatch:

# Least privilege: nothing by default; each job asks only for what it needs.
permissions:
  contents: read

jobs:
  # Everything that runs other people's code (npm packages, the EVS tool, the tests, the build) happens here, with
  # read-only access: this job can't publish releases, push to the repository or make build records.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is this version already released?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Shown version: otoVersion (e.g. 0.9.8.1); the updater uses "version" (e.g. 0.9.801).
          v=$(node -p "const p=require('./package.json'); p.otoVersion || p.version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Done only if the release exists AND has latest.yml (what Oto's updater reads).
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.yml$'; then
            echo "v$v is already released, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # A release only reaches people if its number is higher than the one they have (main/version.js).
      - name: Is this version newer than the published one?
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/version-guard.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.skip != 'true'
        shell: bash
        # GitHub sometimes answers the castlabs Electron download with 504, and Electron's installer then fails without an
        # error: done only when Electron is really there. Up to 5 tries, waiting longer each time.
        run: n=0; until npm ci && node -e "require('fs').accessSync(require('electron'))"; do n=$((n+1)); [ $n -ge 5 ] && exit 1; echo "retrying in $((n*30)) s"; sleep $((n*30)); done

      # Red tests, a broken security rule, a known high-severity vulnerability in what Oto ships, or a failed
      # end-to-end check of the real app (on Windows: DPAPI, Mark of the Web…) stop the release before anything is built.
      - name: Tests and checks
        if: steps.check.outputs.skip != 'true'
        run: |
          npm test
          npm run lint
          npm audit --omit=dev --audit-level=high

      - name: End-to-end tests (Windows)
        if: steps.check.outputs.skip != 'true'
        run: npm run test:e2e

      # Production Widevine (VMP) signing for Netflix & co. — castlabs EVS, free account.
      # Set the repo secrets EVS_ACCOUNT_NAME and EVS_PASSWD to turn it on (build/vmp-sign.js).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: '3.12'

      # Exact versions with their SHA-256 (.github/requirements-evs.txt): a changed or newer package is refused.
      - name: Install the VMP signing tool
        if: steps.check.outputs.skip != 'true'
        run: python -m pip install --require-hashes --only-binary ':all:' -r .github/requirements-evs.txt

      # (1.8.0) Tor for Oto VPN: the Tor Project's expert bundle, accepted only with a valid signature by the pinned
      # Tor Browser key (scripts/fetch-tor.js). Shipped as resources/tor.
      - name: Get Tor (signature checked)
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: n=0; until node scripts/fetch-tor.js; do n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "retrying in $((n*20)) s"; sleep $((n*20)); done

      - name: Build installer
        if: steps.check.outputs.skip != 'true'
        env:
          OTO_VERSION: ${{ steps.check.outputs.version }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        shell: bash
        # Builds with the Electron npm ci installed (no second download); retried up to 3 times (each try from scratch).
        # If GitHub won't serve the NSIS tools, retries use the npm mirror: electron-builder pins their SHA-256, so a
        # changed file is refused.
        run: n=0; until npx electron-builder --win nsis --x64 --publish never "-c.electronDist=$(node -p "require('path').dirname(require('electron'))")"; do n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "retrying in 30 s (build tools from the npm mirror; electron-builder checks their SHA-256)"; export ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/; rm -rf dist; sleep 30; done

      # (1.8.0) Tor really is inside the app, with its geoip files and licence, and it runs on Windows.
      - name: Check Tor in the app
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          t=dist/win-unpacked/resources/tor
          test -f $t/tor/tor.exe && test -f $t/data/geoip && test -f $t/licenses/tor-LICENSE.txt && test -f $t/VERSION.json
          v=$($t/tor/tor.exe --version); echo "$v"; echo "$v" | grep -q '^Tor version'

      - name: Check the Widevine signature
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
        run: if [ -n "$EVS_ACCOUNT_NAME" ]; then python -m castlabs_evs.vmp -n verify-pkg dist/win-unpacked; else echo "no EVS account, skipped"; fi

      # SHA-256 checksums (anyone can check a download wasn't changed).
      - name: Checksums
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          v="${{ steps.check.outputs.version }}"
          # (1.7.13) software bill of materials: every npm package Oto ships, with versions and lockfile hashes (CycloneDX)
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > dist/oto-sbom.cdx.json
          cd dist && sha256sum "Oto-Setup-$v.exe" "Oto-Setup-$v.exe.blockmap" oto-sbom.cdx.json latest*.yml | tee SHA256SUMS.txt

      - name: Hand the files to the release job
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          v="${{ steps.check.outputs.version }}"
          mkdir out && cp "dist/Oto-Setup-$v.exe" "dist/Oto-Setup-$v.exe.blockmap" dist/SHA256SUMS.txt dist/oto-sbom.cdx.json out/
          for f in dist/*.yml; do [ "$(basename "$f")" = builder-debug.yml ] || cp "$f" out/; done
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.skip != 'true'
        with:
          name: release-files
          path: out/
          retention-days: 3
          if-no-files-found: error

  # (1.9.4) Linux: an Arch package (.pacman: installs to /opt/Oto with an app-menu entry, updates through pacman) and an
  # AppImage (runs anywhere, updates itself). Same rules as the Windows build: read-only, nothing published from here.
  # Tor isn't bundled on Linux; Oto VPN uses the system's tor package (an optional dependency of the Arch package).
  build-linux:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # bsdtar packs the Arch package; xvfb runs the built app once below
      - run: sudo apt-get update -q && sudo apt-get install -y -q libarchive-tools xvfb
      - name: Install (with Electron)
        shell: bash
        run: n=0; until npm ci && node -e "require('fs').accessSync(require('electron'))"; do n=$((n+1)); [ $n -ge 5 ] && exit 1; echo "retrying in $((n*30)) s"; sleep $((n*30)); done
      - name: Build the Linux packages
        env:
          OTO_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: n=0; until npx electron-builder --linux AppImage pacman --x64 --publish never "-c.electronDist=$(node -p "require('path').dirname(require('electron'))")"; do n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "retrying in 30 s"; rm -rf dist; sleep 30; done
      # The Arch package is for x86_64, knows it's a pacman install (so updates go through pacman), and the update file
      # lists both packages. Then the built app is started once: it must keep running and have all its libraries
      # (Shield's full blocker, extensions), not fall back.
      - name: Check the Linux packages
        env:
          V: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -e
          test -f "dist/Oto-$V.AppImage" && test -f "dist/Oto-$V.pacman" && test -f dist/latest-linux.yml
          bsdtar -xOf "dist/Oto-$V.pacman" .PKGINFO | tee /dev/stderr | grep -q '^arch = x86_64'
          bsdtar -tf "dist/Oto-$V.pacman" | grep -qx 'opt/Oto/resources/package-type'
          bsdtar -xOf "dist/Oto-$V.pacman" usr/share/applications/oto.desktop | grep -q 'WebBrowser'
          grep -q "url: Oto-$V.pacman" dist/latest-linux.yml && grep -q "url: Oto-$V.AppImage" dist/latest-linux.yml
          xvfb-run -a dist/linux-unpacked/oto --no-sandbox --user-data-dir="$RUNNER_TEMP/oto-smoke" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          sleep 20
          pgrep -f 'dist/linux-unpacked/oto' > /dev/null || { cat "$RUNNER_TEMP/smoke.log"; echo "Oto quit on its own"; exit 1; }
          pkill -f 'dist/linux-unpacked/oto' || true
          if grep -E "Cannot find module|full blocker unavailable|extension APIs unavailable" "$RUNNER_TEMP/smoke.log"; then echo "the packaged app is missing something"; exit 1; fi
          echo "Linux packages OK"
      - name: Checksums and hand-over
        env:
          V: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          mkdir out-linux
          cp "dist/Oto-$V.AppImage" "dist/Oto-$V.pacman" dist/latest-linux.yml out-linux/
          cd out-linux && sha256sum "Oto-$V.AppImage" "Oto-$V.pacman" latest-linux.yml | tee SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-linux
          path: out-linux/
          retention-days: 3
          if-no-files-found: error

  # (1.7.13) Linux end-to-end tests are a release gate too, on the exact commit being released, in this same run: the
  # build job above runs the unit tests and the Windows end-to-end tests; nothing is published unless both pass. (The
  # separate "Checks" workflow is a fast signal on every push, not the release gate.)
  e2e-linux:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - name: Install (with Electron)
        shell: bash
        run: n=0; until npm ci && node -e "require('fs').accessSync(require('electron'))"; do n=$((n+1)); [ $n -ge 5 ] && exit 1; echo "retrying in $((n*30)) s"; sleep $((n*30)); done
      - name: End-to-end tests (Linux)
        run: npm run test:e2e

  # (1.7.13) Release gate: Oto Accounts' Row-Level Security, checked live with the two dedicated TEST accounts, in both
  # directions (scripts/rls-check.js, which fails closed: missing test accounts or an unreachable backend stop the
  # release). Plain Node, no npm packages, so no third-party code ever runs next to the test-account secrets.
  backend:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Accounts can't see each other's data
        env:
          OTO_RLS_A_EMAIL: ${{ secrets.OTO_RLS_A_EMAIL }}
          OTO_RLS_A_PASSWORD: ${{ secrets.OTO_RLS_A_PASSWORD }}
          OTO_RLS_B_EMAIL: ${{ secrets.OTO_RLS_B_EMAIL }}
          OTO_RLS_B_PASSWORD: ${{ secrets.OTO_RLS_B_PASSWORD }}
        run: node scripts/rls-check.js

  # Publishing: a short job that runs no packages, tests or build tools. It gets the files from the build job, checks
  # them against the build job's checksums, makes the signed GitHub build record (who built this installer, from which
  # commit) and publishes the release. Only this job has write access and the build-record token.
  release:
    needs: [build, build-linux, e2e-linux, backend]
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # publish the release
      id-token: write      # signed build provenance
      attestations: write
    outputs:
      version: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files-linux
          path: dist

      - name: Check the files
        shell: bash
        run: cd dist && ls -la && sha256sum -c SHA256SUMS.txt && sha256sum -c SHA256SUMS-linux.txt

      # gh attestation verify Oto-Setup-X.exe --repo mukairyo/oto
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Oto-Setup-${{ needs.build.outputs.version }}.exe
            dist/Oto-${{ needs.build.outputs.version }}.AppImage
            dist/Oto-${{ needs.build.outputs.version }}.pacman

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ needs.build.outputs.version }}"
          files=("dist/Oto-Setup-$v.exe" "dist/Oto-Setup-$v.exe.blockmap" "dist/SHA256SUMS.txt" "dist/oto-sbom.cdx.json" "dist/Oto-$v.AppImage" "dist/Oto-$v.pacman" "dist/SHA256SUMS-linux.txt")
          for f in dist/*.yml; do files+=("$f"); done
          # tester builds (e.g. 0.10.0-beta.1) are pre-releases: only Beta/Alpha testers get them
          pre=(); [[ "$v" == *-* ]] && pre=(--prerelease)
          ls -la "${files[@]}"
          bash .github/release-notes.sh "$v" > notes.md
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$v" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "v$v" --title "Oto $v" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$v" "${files[@]}" "${pre[@]}" --title "Oto $v" --notes-file notes.md --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

  # Downloads the installer exactly as the public gets it from the release page and checks it two ways:
  # its SHA-256 matches SHA256SUMS.txt, and GitHub's signed build record says this workflow built it from this
  # commit. If either fails, the run goes red so it's noticed right away.
  verify:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check the published installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.release.outputs.version }}
        run: |
          mkdir pub && cd pub
          gh release download "v$V" --repo "$GITHUB_REPOSITORY" -p "Oto-Setup-$V.exe" -p "Oto-Setup-$V.exe.blockmap" -p "SHA256SUMS.txt" -p "oto-sbom.cdx.json" -p "latest*.yml"
          sha256sum -c SHA256SUMS.txt
          gh attestation verify "Oto-Setup-$V.exe" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          # latest.yml (what the updater trusts) must describe this exact installer
          want=$(openssl dgst -sha512 -binary "Oto-Setup-$V.exe" | base64 -w0)
          grep -q "$want" latest.yml && echo "latest.yml matches the installer"
          # (1.9.4) the Linux packages: checksums, build records, and latest-linux.yml describes both exact files
          gh release download "v$V" --repo "$GITHUB_REPOSITORY" -p "Oto-$V.AppImage" -p "Oto-$V.pacman" -p "SHA256SUMS-linux.txt"
          sha256sum -c SHA256SUMS-linux.txt
          for f in "Oto-$V.AppImage" "Oto-$V.pacman"; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            want=$(openssl dgst -sha512 -binary "$f" | base64 -w0)
            grep -q "$want" latest-linux.yml && echo "latest-linux.yml matches $f"
          done

  # Keeps every release's notes in step with CHANGELOG.md (so fixing a typo there fixes the release page).
  notes:
    needs: release
    permissions:
      contents: write      # edit the release notes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            v="${tag#v}"
            bash .github/release-notes.sh "$v" > notes.md
            if grep -q . notes.md; then
              # GitHub sometimes answers 502 for a moment — retry, and never fail the release over old notes
              for try in 1 2 3; do
                if gh release edit "$tag" --title "Oto $v" --notes-file notes.md --repo "$GITHUB_REPOSITORY" >/dev/null; then echo "updated $tag"; break; fi
                echo "retrying $tag ($try)"; sleep $((try * 5))
              done
            fi
          done
