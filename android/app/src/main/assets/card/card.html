<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Oto Card</title>
<style>
  :root { --bg: #0b0b0c; --line2: rgba(255,255,255,.14); --fg: #ece8e1; --fg2: rgba(236,232,225,.64); --fg3: rgba(236,232,225,.38); --cream: #e7dfd1; --mono: 'Roboto Mono', 'Droid Sans Mono', monospace; --serif: 'Noto Serif', Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 420px; margin: 0 auto; padding: 22px 20px 40px; }
  .crumb { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font: 600 10px var(--mono); letter-spacing: .28em; color: var(--fg2); }
  .crumb .d { width: 16px; height: 1px; background: var(--fg2); }
  h1 { margin: 0 0 18px; font: 400 40px/1 var(--serif); letter-spacing: -1px; }
  .stage { perspective: 1200px; display: flex; justify-content: center; }
  .card { width: min(100%, 320px); transition: transform .5s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; cursor: pointer; }
  .card svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 18px 40px rgba(0,0,0,.55)); }
  .card.flip { transform: rotateY(180deg); }
  .card .back { transform: rotateY(180deg); }
  .hint { margin: 12px 0 22px; text-align: center; font: 500 9px var(--mono); letter-spacing: .2em; color: var(--fg3); text-transform: uppercase; }
  .lvl { padding: 14px 16px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line2); }
  .lvl .t { display: flex; justify-content: space-between; align-items: baseline; font: 600 11px var(--mono); letter-spacing: .14em; }
  .lvl .t b { font: 600 15px system-ui, sans-serif; letter-spacing: 0; }
  .bar { height: 6px; margin: 10px 0 8px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--cream); }
  .lvl small { color: var(--fg2); font-size: 12px; }
  .note { margin-top: 18px; color: var(--fg3); font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <div class="crumb"><span class="d"></span>OTO // CARD</div>
  <h1>Your Oto Card</h1>
  <div class="stage"><div class="card" id="card" role="button" aria-label="Flip the card"></div></div>
  <div class="hint" id="hint">Tap the card to see your badges</div>
  <div class="lvl" id="lvl"></div>
  <p class="note" id="note"></p>
</main>
<script src="card-core.js"></script>
<script src="card.js"></script>
</body>
</html>
